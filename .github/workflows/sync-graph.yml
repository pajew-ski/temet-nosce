name: sync graph

on:
  push:
    paths:
      - "graph/nodes/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun scripts/sync-graph.mjs
      - name: commit generated files if changed
        run: |
          if git diff --quiet -- graph/index.md docs/graph-data.json n8n/*.json; then
            echo "index, graph data, and workflows already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph/index.md docs/graph-data.json n8n/*.json
          git commit -m "chore: sync graph index and data"
          git push
